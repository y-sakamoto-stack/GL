<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>シンプルタイマー</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>タイマー</h1>

    <div class="display" id="display">00:00</div>

    <div class="inputs" id="inputs">
      <div class="input-group">
        <input type="number" id="minutes" min="0" max="99" value="0" placeholder="0" />
        <span class="unit">分</span>
      </div>
      <div class="input-group">
        <input type="number" id="seconds" min="0" max="59" value="0" placeholder="0" />
        <span class="unit">秒</span>
      </div>
    </div>

    <div class="controls">
      <button id="start-btn">スタート</button>
      <button id="pause-btn" class="hidden">一時停止</button>
      <button id="reset-btn">リセット</button>
    </div>

    <div class="status" id="status"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
